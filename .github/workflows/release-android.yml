name: Release Android APK

# Builds an installable APK and attaches it to a GitHub Release (free hosting).
# Run it from the Actions tab ("Run workflow", type a version such as v1.0.0),
# or push a tag:  git tag v1.0.0 && git push origin v1.0.0
# The APK is signed with the debug key, which is fine for installing directly
# on a phone but is not accepted by Google Play.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Add a Maven Central mirror (GitHub downloads sometimes time out)
        run: |
          mkdir -p ~/.gradle/init.d
          cp tool/maven-mirror.init.gradle ~/.gradle/init.d/
      - name: Build release APK
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Build failed (attempt $attempt), retrying..."
            sleep 30
          done
          exit 1
      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-release.apk did-i-tell-you.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: Did I Tell You? ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: did-i-tell-you.apk
