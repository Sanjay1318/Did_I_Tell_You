name: did_i_tell_you
description: Personal Memory App - "Did I Already Tell You?"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  share_plus: ^10.0.2
  intl: ^0.19.0
  file_picker: ^8.1.7
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs the app on a real phone or emulator (see integration_test/).
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Lets database tests run on a desktop/CI machine instead of a phone.
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
