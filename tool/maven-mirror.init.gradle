// Gradle init script used by CI.
//
// Maven Central serves some large artifacts (such as the Kotlin compiler jar)
// through a redirect to GitHub releases, and when GitHub downloads time out
// (HTTP 504) the whole Android build fails. This puts Google's Maven Central
// mirror first in every repository list; anything the mirror does not have
// still comes from the normal repositories afterwards.
//
// Installed by the workflows with:
//   mkdir -p ~/.gradle/init.d && cp tool/maven-mirror.init.gradle ~/.gradle/init.d/

import org.gradle.api.initialization.resolve.RepositoriesMode

def mirrorUrl = 'https://maven-central.storage-download.googleapis.com/maven2/'

def addMirror = { RepositoryHandler repos ->
    def mirror = repos.maven {
        name = 'MavenCentralMirror'
        url = mirrorUrl
    }
    repos.remove(mirror)
    repos.addFirst(mirror)
}

beforeSettings { settings ->
    addMirror(settings.pluginManagement.repositories)
}

gradle.settingsEvaluated { settings ->
    // Used by builds that declare their repositories in settings.gradle.
    addMirror(settings.dependencyResolutionManagement.repositories)
}

allprojects { project ->
    addMirror(project.buildscript.repositories)
    // Builds that "prefer settings repositories" refuse repositories added
    // to a project, so only add one where projects are allowed their own.
    def mode = gradle.settings.dependencyResolutionManagement.repositoriesMode.get()
    if (mode == RepositoriesMode.PREFER_PROJECT) {
        addMirror(project.repositories)
    }
}
